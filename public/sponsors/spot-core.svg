<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <style>
      .card-bg { fill: #f5f5f5; stroke: rgba(0, 0, 0, 0.08); }
      .card-inner { stroke: rgba(255, 255, 255, 0.9); }
      .card-plus { stroke: #737373; }
      @media (prefers-color-scheme: dark) {
        .card-bg { fill: #171717; stroke: rgba(255, 255, 255, 0.1); }
        .card-inner { stroke: rgba(255, 255, 255, 0.06); }
        .card-plus { stroke: #a3a3a3; }
      }
    </style>
  </defs>

  <!-- Rotated Diamond Squircle -->
  <rect x="29" y="29" width="102" height="102" rx="26" transform="rotate(45 80 80)" class="card-bg" stroke-width="1.2" />
  <rect x="30" y="30" width="100" height="100" rx="25" transform="rotate(45 80 80)" class="card-inner" stroke-width="1" />

  <!-- Centered Plus Icon -->
  <line x1="70" y1="80" x2="90" y2="80" class="card-plus" stroke-width="2.5" stroke-linecap="round" />
  <line x1="80" y1="70" x2="80" y2="90" class="card-plus" stroke-width="2.5" stroke-linecap="round" />
</svg>
