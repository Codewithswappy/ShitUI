<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <defs>
    <filter id="pill-glow" x="-20%" y="-30%" width="140%" height="180%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" in="SourceAlpha" result="blur" />
      <feOffset dx="0" dy="3" in="blur" result="offset" />
      <feFlood flood-color="#3074fe" flood-opacity="0.45" result="color" />
      <feComposite in2="offset" in="color" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="pill-grad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#4182ff" />
      <stop offset="100%" stop-color="#2464f0" />
    </linearGradient>

    <linearGradient id="inset-highlight" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Glowing Pill Body -->
  <g filter="url(#pill-glow)">
    <rect x="10" y="6" width="240" height="40" rx="12" fill="url(#pill-grad)" />
    <rect x="10.5" y="6.5" width="239" height="39" rx="11.5" stroke="url(#inset-highlight)" stroke-width="1" />
  </g>

  <!-- Heart / Star Icon -->
  <g transform="translate(32, 18)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 14.5s-6-3.8-6-8.2A4.3 4.3 0 0 1 6.3 2c1.2 0 2.3.6 2.7 1.6C9.4 2.6 10.5 2 11.7 2A4.3 4.3 0 0 1 16 6.3c0 4.4-6 8.2-6 8.2l-2 1.4z" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- Label -->
  <text x="138" y="31" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.3" text-anchor="middle">
    Become a Sponsor
  </text>
</svg>

