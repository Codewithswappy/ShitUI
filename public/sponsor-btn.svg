<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-20%" width="120%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.2" />
    </filter>

    <linearGradient id="btn-grad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="btn-highlight" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Button Body -->
  <g filter="url(#subtle-shadow)">
    <rect x="10" y="4" width="220" height="38" rx="19" fill="url(#btn-grad)" />
    <rect x="10.5" y="4.5" width="219" height="37" rx="18.5" stroke="url(#btn-highlight)" stroke-width="1" />
  </g>

  <!-- Perfect Symmetrical Heart Icon -->
  <g transform="translate(48, 15) scale(0.72)">
    <path fill="#ffffff" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </g>

  <!-- Label -->
  <text x="74" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.2">
    Become a Sponsor
  </text>
</svg>
